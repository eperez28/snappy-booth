name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm run build:mac-web
      - run: swift build
